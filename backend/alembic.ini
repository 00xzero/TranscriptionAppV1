# Alembic Configuration

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for migration file timestamps (leave blank for local time)
# timezone =

# Truncate revision hashes to this length (min 4)
truncate_slug_length = 40

# Set to true for 'revision' command to auto-generate
# revision_environment = false

# Set to 'true' to fail on missing source file (unversioned)
# sourceless = false

# Database URL - overridden by env.py to use settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Format using black after generating migration
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
